
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON-AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080d1b;
            color: white;
        }

        header {
            background: #111a30;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d9ff;
        }

        header h1 {
            color: #00d9ff;
            margin: 0;
            font-size: 30px;
        }

        header p {
            color: #bbb;
        }

        .chat-container {
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            background: #111a30;
            border-radius: 15px;
            min-height: 450px;
        }

        #messages {
            height: 330px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            line-height: 1.5;
        }

        .bot {
            background: #203451;
            color: #00d9ff;
        }

        .user {
            background: #075985;
            text-align: right;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 14px 20px;
            background: #00bde8;
            color: #00111b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00e5ff;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🐉 DRAGON-AI</h1>
    <p>Your Smart Personal AI Assistant</p>
</header>

<div class="chat-container">

    <div id="messages">
        <div class="message bot">
            Hello! Welcome to DRAGON-AI 🐉
            How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask Dragon-AI something..."
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<footer>
    © 2026 DRAGON-AI | Created by You
</footer>

<script>
    function sendMessage() {
        const input = document.getElementById("userInput");
        const messages = document.getElementById("messages");

        const question = input.value.trim();

        if (question === "") return;

        const userMessage = document.createElement("div");
        userMessage.className = "message user";
        userMessage.textContent = question;
        messages.appendChild(userMessage);

        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.textContent =
            "I received your message! My AI brain is being developed. 🐉";

        messages.appendChild(botMessage);

        input.value = "";
        messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("userInput")
        .addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
</script>

</body>
</html>
